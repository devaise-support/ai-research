# client_profiles.yaml - クライアント業種別プロフィール設定
#
# content_generator.py がクライアントレポート生成時に参照する。
# 各業種の「関心事」「言語レベル」「提案形式」を定義する。

profiles:

  beauty_salon:
    name: "美容サロン・ヘアサロン"
    genres:
      - "顧客体験向上"
      - "予約・リピーター管理"
      - "SNSマーケティング"
      - "スタッフ業務効率化"
    ai_interests:
      - "予約システムへのチャットボット導入"
      - "Instagram / TikTok 投稿の自動生成"
      - "顧客カルテのAI分析"
      - "スタッフ教育コンテンツの自動作成"
    language_level: "やさしい日本語（専門用語を避け、具体的なメリットを強調）"
    delivery_format: "A4 1枚・箇条書き中心・導入費用感と工数の目安を必ず記載"
    example_phrases:
      - "お客様の来店頻度を上げる"
      - "スタッフの負担を減らす"
      - "SNSのフォロワーを増やす"

  real_estate:
    name: "不動産・住宅業"
    genres:
      - "物件情報の自動作成"
      - "顧客マッチング"
      - "契約書・書類の効率化"
      - "市場分析・価格予測"
    ai_interests:
      - "物件説明文の自動生成"
      - "顧客ニーズとの物件マッチングAI"
      - "契約書レビューの自動化"
      - "エリア相場のAI分析レポート"
    language_level: "ビジネス標準語（数字・ROI根拠を重視）"
    delivery_format: "概要・課題・解決策・導入ステップの4段構成。コスト試算表付き"
    example_phrases:
      - "物件掲載コストを削減する"
      - "成約率を向上させる"
      - "業務時間を〇〇時間削減"

  healthcare:
    name: "医療・クリニック・介護"
    genres:
      - "問診票・カルテのデジタル化"
      - "患者コミュニケーション"
      - "スタッフ業務効率化"
      - "医療情報提供"
    ai_interests:
      - "問診票の自動入力・解析"
      - "服薬リマインダーのチャットボット"
      - "医療文書の要約・翻訳"
      - "シフト管理の最適化"
    language_level: "丁寧な敬語（患者プライバシーへの配慮・規制遵守を明示）"
    delivery_format: "リスクと効果のバランスを記載。法的注意点（医療法・個人情報保護法）を明示"
    example_phrases:
      - "患者さんの待ち時間を短縮"
      - "スタッフの残業を削減"
      - "個人情報保護に配慮した活用"

  finance:
    name: "金融・保険・会計事務所"
    genres:
      - "書類・レポート自動生成"
      - "リスク分析"
      - "顧客対応の効率化"
      - "コンプライアンス管理"
    ai_interests:
      - "決算書・レポートの自動要約"
      - "不正検知AI"
      - "FAQ チャットボット"
      - "規制変更の自動モニタリング"
    language_level: "フォーマルな文体（数値根拠・法令参照必須）"
    delivery_format: "セキュリティ対策と監査対応を明記。費用対効果の定量試算を含める"
    example_phrases:
      - "コンプライアンスコストを削減"
      - "審査・分析の精度向上"
      - "監査対応の工数削減"

  retail:
    name: "小売・EC・飲食"
    genres:
      - "商品説明・コピーライティング"
      - "在庫・発注管理"
      - "顧客レビュー分析"
      - "キャンペーン最適化"
    ai_interests:
      - "商品説明文の自動生成"
      - "レビュー感情分析"
      - "需要予測による在庫最適化"
      - "チラシ・バナー画像のAI生成"
    language_level: "わかりやすい日本語（すぐ使えるツール紹介を優先）"
    delivery_format: "Before/After 形式で効果を可視化。月額費用・無料トライアル有無を記載"
    example_phrases:
      - "売上を〇〇%アップ"
      - "業務時間を半分に"
      - "今すぐ無料で試せる"

# デフォルト設定（プロフィール未定義業種向け）
default:
  language_level: "ビジネス標準語（具体的なメリットと導入ステップを明記）"
  delivery_format: "課題・解決策・導入コスト・期待効果の4項目"
